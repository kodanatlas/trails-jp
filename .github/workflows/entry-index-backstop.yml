name: entry-index-backstop

# Vercel Hobby の cron はベストエフォートで「無音スキップ」しうる（実際に sync-entries が
# 1日滑り、entry-index.json が固定化して最近の申込者が選手ページに出ない事故が起きた）。
# その保険として、GitHub Actions から本番 sync-entries を叩いて索引を作り直させる。
# サーバ側に「品質ガード（低品質上書き拒否）」と「events.json fail-closed」があるため、
# Vercel cron との二重実行・冪等な再生成は安全。
#
# 必要な Secret: CRON_SECRET（Vercel 本番の CRON_SECRET と同値）。
# 手動実行も可（Actions 画面の "Run workflow" / workflow_dispatch）。

on:
  schedule:
    # 20:30 UTC = 05:30 JST。Vercel の sync-entries(19:00 UTC 枠・実行は枠内のどこか)より十分後。
    - cron: "30 20 * * *"
  workflow_dispatch: {}

# 同時実行を避ける（手動 + スケジュールの重なり対策）。
concurrency:
  group: entry-index-backstop
  cancel-in-progress: false

jobs:
  trigger-sync-entries:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-entries (retry x3)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret が未設定です（リポジトリ Secrets に登録してください）"
            exit 1
          fi
          url="https://trailsjp.vercel.app/api/cron/sync-entries"
          for i in 1 2 3; do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 90 \
              -H "authorization: Bearer $CRON_SECRET" "$url")
            rc=$?
            if [ "$rc" -ne 0 ]; then code="000"; fi
            echo "attempt $i -> HTTP $code (curl rc=$rc)"
            cat resp.json 2>/dev/null || true
            echo
            # HTTP 200 だけでは不十分: 品質ガードのブロックも 200 + {"success":false,"blocked":...} を返すため、
            # それを成功と誤認すると「索引未刷新なのに緑」になる。本文の success を必ず確認する。
            if [ "$code" = "200" ]; then
              success=$(jq -r 'try .success catch "parse_error"' resp.json 2>/dev/null || echo "parse_error")
              if [ "$success" = "true" ]; then
                echo "done (索引を再生成しました)"
                exit 0
              fi
              # success=false = 品質ガードによる決定的ブロック。リトライしても結果は変わらず JOY 連打を招くだけ。
              # サーバ側で既存 index を保持し error/warning も通知済み → 即 error 終了で可視化する（リトライしない）。
              blocked=$(jq -r 'try .blocked catch ""' resp.json 2>/dev/null || echo "")
              echo "::error::sync-entries が索引刷新を拒否しました（success=$success, blocked=$blocked）。劣化ガード作動。JOY/どこオリの遮断・パース不全・部分スクレイプを確認してください。"
              exit 1
            fi
            # 非200（500=全滅 / events 読込失敗 fail-closed 等）は一時障害の可能性 → リトライ。
            echo "attempt $i: HTTP $code（非200）。リトライします。"
            sleep 20
          done
          echo "::error::sync-entries が3回とも非200。Vercel/JOY/どこオリ側を確認してください。"
          exit 1
