name: geocode-smoke

# ジオコーディングの実データ・スモークゲート（再発防止）。
# 国土地理院(GSI)の実レスポンスに対し pickBestLatLng が難所の地名を正しく解決するかを
# 検証する。単体テストは GSI をモックするため、実APIの揺れ（同名近接で中目黒駅が上位に来る等）
# や lat/lng スワップ・ベンダ応答変化は捕捉できない。本スモークが硬いオラクル
# （期待座標から 2km 以内なら pass、1件でも外れたら exit 1）。
#
# トリガ:
#   - schedule … GSI 側のベンダ変化を日次で監視（コード無変更でも壊れうる）。
#   - pull_request / push(main) … geocode 関連ファイルを変更した PR/コミットの回帰検知。
#   - workflow_dispatch … 手動実行。
# secret 不要（GSI は公開API）。

on:
  schedule:
    # 22:00 UTC = 07:00 JST。データ同期 cron 群（18:00/19:00/20:30 UTC 等）と独立・非衝突。
    - cron: "0 22 * * *"
  pull_request:
    paths:
      - "src/lib/carpool/geocode.ts"
      - "src/lib/carpool/venue-coords.ts"
      - "scripts/geocode-smoke.ts"
      - ".github/workflows/geocode-smoke.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/carpool/geocode.ts"
      - "src/lib/carpool/venue-coords.ts"
      - "scripts/geocode-smoke.ts"
      - ".github/workflows/geocode-smoke.yml"
  workflow_dispatch: {}

concurrency:
  group: geocode-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci ではなく npm install（test.yml と同じ理由: lockfile が厳密同期でない）。
      - run: npm install --no-audit --no-fund
      - name: geocode smoke (real GSI)
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/geocode-smoke.ts 2>&1 | tee geocode-smoke.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocode-smoke-log
          path: geocode-smoke.log
          retention-days: 14
