le\":\"AI翻訳機能\",\"aiTranslateDescription\":\"日本語で入力した内容をAIが自動で英語に翻訳します。「AI翻訳」ボタンを押すだけで、バイリンガルなイベント情報が作成できます。\",\"aiTranslateAlt\":\"AI翻訳ボタン\"},\"faq\":{\"title\":\"よくある質問\",\"q1\":{\"question\":\"イベント掲載は無料ですか？\",\"answer\":\"はい、完全に無料です。登録・掲載・編集すべて無料でご利用いただけます。\"},\"q2\":{\"question\":\"登録後に編集できますか？\",\"answer\":\"はい、いつでも編集できます。イベント一覧から自分のイベントを選択し、編集ボタンから変更できます。\"},\"q3\":{\"question\":\"英語のイベント情報も登録できますか？\",\"answer\":\"はい、日本語と英語の2言語に対応しています。フォーム上部の言語切り替えで入力でき、AI翻訳機能で自動翻訳も可能です。\"},\"q4\":{\"question\":\"どんなイベントでも登録できますか？\",\"answer\":\"オリエンテーリングをはじめとするナビゲーションスポーツに関連するイベントであれば、大会、練習会、講習会、交流会など幅広く登録できます。フットO以外にもスキーO、トレイルO、MTBO、ロゲイニングに対応しています。\"},\"q5\":{\"question\":\"イベントを中止にしたい場合は？\",\"answer\":\"イベント編集画面から中止に設定できます。一覧上で「中止」ステータスが表示されます。\"},\"q6\":{\"question\":\"組織のアカウントが必要ですか？\",\"answer\":\"いいえ、個人アカウントだけでイベントを登録できます。組織を紐づけると、組織名が主催者として表示されます。\"},\"q7\":{\"question\":\"必須項目はどれですか？\",\"answer\":\"イベント名、競技、イベント形式、開催日程、主催者の5つだけです。その他の項目はすべて任意なので、まずは最低限の情報で気軽に登録できます。\"}},\"cta\":{\"title\":\"さっそく登録してみよう\",\"description\":\"必須項目はたった5つ。3分あれば登録できます。\",\"button\":\"イベントを登録する\"},\"afterEvent\":{\"title\":\"イベント後にもできること\",\"subtitle\":\"イベントが終わった後でも、情報を追加・更新できます\",\"items\":{\"lapcenter\":{\"title\":\"Lap Center の登録\",\"description\":\"Lap Center URLを追加して、参加者がリザルトやスプリットタイムを確認できるようにしましょう\"},\"terrain\":{\"title\":\"テレインとの紐づけ\",\"description\":\"テレインを紐づけると、テレインページからイベント情報や地図・会場の詳細にアクセスできます\"},\"mapSales\":{\"title\":\"地図データの販売\",\"description\":\"大会で使った地図を、どこオリの販売機能で永久的に販売できます。クリエイターダッシュボードから登録しましょう\"}}},\"eventsBanner\":{\"title\":\"初めてイベントを登録する方へ\",\"description\":\"掲載ガイドを見る\",\"cta\":\"ガイドを見る\"}},\"eventDetail\":{\"hero\":{\"label\":{\"ranking\":{\"wre\":\"WRE\",\"normal\":\"ランキング対象\"},\"official\":\"公認大会\"},\"favorite\":\"お気に入り\",\"share\":\"シェア\",\"officialSite\":\"公式サイト\",\"imageCount\":\"{current} / {total}\"},\"stats\":{\"dates\":\"開催期間\",\"location\":\"開催地\",\"deadline\":\"申込締切\",\"entrants\":\"{count}名 が現在申込中\",\"deadlineRemaining\":\"締切まで {days} 日\"},\"cta\":{\"vie
